name: "Windows Build Workflow"

# Triggers the optimized Windows-only workflow to build and upload the .exe installer artifact.

on:
  workflow_dispatch:

jobs:
  build:
    name: "Windows x64 Build (.exe)"
    permissions:
      contents: write

    uses: ./.github/workflows/build-nosigning.yml

    with:
      platform: windows-latest
      target: x86_64-pc-windows-msvc
      build-args: ""
      upload-artifacts: true
      sign-binaries: false

    secrets: inherit
